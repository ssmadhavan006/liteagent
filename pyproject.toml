[project]
name = "liteagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.81.1",
    "grpcio-tools>=1.81.1",
    "huggingface-hub>=1.22.0",
    # Pinned to the CPU build. The cu124 wheel loads and prefills on the RTX 5070
    # but aborts in ggml-cuda after ~32 decode steps: its vendored llama.cpp
    # predates Blackwell (sm_120) and PTX JIT does not cover every decode kernel.
    # See architecture.md 10.2 before attempting a GPU build again.
    "llama-cpp-python==0.3.1",
    "numpy>=1.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
liteagent = "liteagent.cli:main"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: requires real model weights and runs actual inference",
]

[tool.hatch.build.targets.wheel]
packages = ["src/liteagent"]

[[tool.uv.index]]
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]


